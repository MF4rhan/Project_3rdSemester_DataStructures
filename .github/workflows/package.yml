name: Package

on:
  push:
    branches:
      - gui-experiment
    paths:
      - '.github/workflows/package.yml'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - 'core/**'
      - 'console/**'
      - 'gui/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows (x64 ZIP)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify MSVC 2022 and CMake environment
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual Studio 2022 with x64 MSVC tools was not found."
          }
          Write-Host "Visual Studio path: $vsPath"

          $clExe = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Filter "cl.exe" -Recurse |
            Where-Object { $_.FullName -match '\\bin\\Hostx64\\x64\\cl\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $clExe) {
            throw "x64 cl.exe not found under $vsPath\VC\Tools\MSVC"
          }
          $clVersion = (Get-Item $clExe).VersionInfo.FileVersion
          Write-Host "MSVC compiler path: $clExe"
          Write-Host "MSVC compiler version: $clVersion"

          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Qt 6.11.3 (MSVC 2022 x64 via aqtinstall)
        run: |
          $ErrorActionPreference = 'Stop'

          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -m pip install --no-cache-dir git+https://github.com/miurahr/aqtinstall.git@f383b3c7d9658e881bd8ce8810057393bd934ee1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $archOutput = python -m aqt list-qt windows desktop --arch 6.11.3 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list Qt 6.11.3 architectures via aqt list-qt (exit code $LASTEXITCODE)."
          }
          Write-Host "Available Qt 6.11.3 Windows desktop architectures:"
          Write-Host $archOutput

          $archTokens = $archOutput -split '\s+' | Where-Object { $_ -ne '' }
          if ($archTokens -notcontains 'win64_msvc2022_64') {
            throw "Qt 6.11.3 architecture 'win64_msvc2022_64' is not listed by aqt list-qt."
          }

          $qtBaseDir = Join-Path $env:RUNNER_TEMP "Qt"
          python -m aqt install-qt -O "$qtBaseDir" windows desktop 6.11.3 win64_msvc2022_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $qtKitDir = Join-Path $qtBaseDir "6.11.3\msvc2022_64"
          $qtConfig = Join-Path $qtKitDir "lib\cmake\Qt6\Qt6Config.cmake"
          if (-not (Test-Path $qtConfig)) {
            throw "Qt6Config.cmake not found at $qtConfig"
          }

          "QT_ROOT_DIR=$qtKitDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installed Qt 6.11.3 MSVC 2022 x64 at: $qtKitDir"

      - name: Configure CMake
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            -DBUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build all targets (Release)
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release `
            --target HuffmanCore HuffmanCLI HuffmanGUI HuffmanCoreTests HuffmanGUITests `
            --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify CTest registration and run tests (Release)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $ErrorActionPreference = 'Stop'
          $testsOutput = ctest --test-dir build -C Release -N | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $testsOutput

          if ($testsOutput -notmatch '(?m)Test\s+#\d+:\s+HuffmanCoreTests\r?$') {
            Write-Error "HuffmanCoreTests is not registered in CTest."
            exit 1
          }
          if ($testsOutput -notmatch '(?m)Test\s+#\d+:\s+HuffmanGUITests\r?$') {
            Write-Error "HuffmanGUITests is not registered in CTest."
            exit 1
          }

          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$env:QT_ROOT_DIR\plugins"
          ctest --test-dir build -C Release --output-on-failure -V
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy, verify, and archive Windows x64 package
        run: |
          $ErrorActionPreference = 'Stop'

          $stageRoot = Join-Path $env:RUNNER_TEMP "win-stage"
          $stageDir = Join-Path $stageRoot "Huffman-Windows-x64"
          $outDir = Join-Path $env:RUNNER_TEMP "win-artifacts"
          New-Item -ItemType Directory -Force -Path $stageDir, $outDir | Out-Null

          Copy-Item "build\Release\HuffmanGUI.exe" -Destination $stageDir
          Copy-Item "build\Release\HuffmanCLI.exe" -Destination $stageDir
          Copy-Item "packaging\windows\README-Windows.txt" -Destination $stageDir

          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          if (-not (Test-Path $windeployqt)) {
            throw "windeployqt.exe not found at $windeployqt"
          }
          Write-Host "Running windeployqt: $windeployqt --release --no-compiler-runtime"
          & $windeployqt --release --no-compiler-runtime "$stageDir\HuffmanGUI.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $vcRedistPath = Join-Path $stageDir "vc_redist.x64.exe"
          Write-Host "Downloading official Microsoft VC++ x64 Redistributable..."
          curl.exe -fSL --retry 3 --retry-delay 5 -o "$vcRedistPath" "$vcRedistUrl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sig = Get-AuthenticodeSignature -FilePath $vcRedistPath
          if ($sig.Status -ne 'Valid') {
            throw "Authenticode verification failed for vc_redist.x64.exe: $($sig.Status) - $($sig.StatusMessage)"
          }
          if ($sig.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft\b') {
            throw "Unexpected vc_redist.x64.exe publisher: $($sig.SignerCertificate.Subject)"
          }
          Write-Host "Verified vc_redist.x64.exe signature: $($sig.SignerCertificate.Subject) ($($sig.SignerCertificate.Thumbprint))"

          $requiredPaths = @(
            "HuffmanGUI.exe",
            "HuffmanCLI.exe",
            "vc_redist.x64.exe",
            "README-Windows.txt",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "platforms\qwindows.dll"
          )
          foreach ($rel in $requiredPaths) {
            $full = Join-Path $stageDir $rel
            if (-not (Test-Path $full)) {
              throw "Required package file missing: $full"
            }
          }

          $forbiddenPatterns = @(
            '*.pdb', '*.lib', '*.exp', '*.ilk', '*.obj', '*.h', '*.hpp',
            'CMakeCache.txt', 'cmake_install.cmake',
            'Qt6Cored.dll', 'Qt6Guid.dll', 'Qt6Widgetsd.dll',
            'vcruntime*.dll', 'msvcp*.dll', 'concrt*.dll'
          )
          $unexpected = Get-ChildItem -Path $stageDir -Recurse -File -Include $forbiddenPatterns
          if ($unexpected) {
            $list = ($unexpected | ForEach-Object { $_.FullName }) -join "`n"
            throw "Unexpected build, debug, or individual CRT files found in package:`n$list"
          }

          Write-Host "Staged Windows package contents:"
          Get-ChildItem -Path $stageDir -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relPath = $_.FullName.Substring($stageDir.Length + 1)
              "{0,-48} {1,10:N0} bytes" -f $relPath, $_.Length
            }

          $zipPath = Join-Path $outDir "Huffman-Windows-x64.zip"
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -CompressionLevel Optimal
          $zipSize = (Get-Item $zipPath).Length
          $zipHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  Huffman-Windows-x64.zip" | Out-File -FilePath (Join-Path $outDir "Huffman-Windows-x64.zip.sha256") -Encoding ascii

          Write-Host ("Created {0} ({1:N0} bytes), SHA-256: {2}" -f $zipPath, $zipSize, $zipHash)

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Huffman-Windows-x64
          path: |
            ${{ runner.temp }}/win-artifacts/Huffman-Windows-x64.zip
            ${{ runner.temp }}/win-artifacts/Huffman-Windows-x64.zip.sha256
          retention-days: 30

  package-linux:
    name: Package Linux (x86-64 AppImage + CLI)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build and AppImage packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            cmake \
            ninja-build \
            qt6-base-dev \
            qmake6 \
            qt6-qpa-plugins \
            qt6-wayland \
            libgl1-mesa-dev \
            patchelf \
            desktop-file-utils \
            file

      - name: Print toolchain, glibc, and Qt versions
        run: |
          g++ --version
          cmake --version
          ninja --version
          ldd --version | head -n 1
          dpkg-query -W -f='qt6-base-dev: ${Version}\nqmake6: ' qt6-base-dev
          /usr/bin/qmake6 -v

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON

      - name: Build all targets
        run: |
          cmake --build build \
            --target HuffmanCore HuffmanCLI HuffmanGUI HuffmanCoreTests HuffmanGUITests \
            --parallel

      - name: Verify CTest registration and run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          tests_output="$(ctest --test-dir build -N)"
          echo "$tests_output"
          grep -Eq 'Test[[:space:]]+#[0-9]+:[[:space:]]+HuffmanCoreTests[[:space:]]*$' <<< "$tests_output" || {
            echo "::error::HuffmanCoreTests is not registered in CTest."
            exit 1
          }
          grep -Eq 'Test[[:space:]]+#[0-9]+:[[:space:]]+HuffmanGUITests[[:space:]]*$' <<< "$tests_output" || {
            echo "::error::HuffmanGUITests is not registered in CTest."
            exit 1
          }
          ctest --test-dir build --output-on-failure -V

      - name: Download and verify linuxdeploy tools
        run: |
          tools_dir="${RUNNER_TEMP}/tools"
          mkdir -p "$tools_dir"

          linuxdeploy_url="https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          linuxdeploy_sha256="c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
          qtplugin_url="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage"

          curl -fSL --retry 3 --retry-delay 5 -o "${tools_dir}/linuxdeploy-x86_64.AppImage" "$linuxdeploy_url"
          echo "${linuxdeploy_sha256}  ${tools_dir}/linuxdeploy-x86_64.AppImage" | sha256sum -c -

          curl -fSL --retry 3 --retry-delay 5 -o "${tools_dir}/linuxdeploy-plugin-qt-x86_64.AppImage" "$qtplugin_url"
          echo "linuxdeploy-plugin-qt-x86_64.AppImage SHA-256 (release 1-alpha-20250213-1 publishes no digest asset):"
          sha256sum "${tools_dir}/linuxdeploy-plugin-qt-x86_64.AppImage"

          chmod +x "${tools_dir}/linuxdeploy-x86_64.AppImage" "${tools_dir}/linuxdeploy-plugin-qt-x86_64.AppImage"
          ln -sf linuxdeploy-plugin-qt-x86_64.AppImage "${tools_dir}/linuxdeploy-plugin-qt"

      - name: Build AppImage and stage Linux package
        run: |
          desktop-file-validate packaging/linux/huffman-studio.desktop

          work_dir="${RUNNER_TEMP}/linux-appimage-work"
          appdir="${RUNNER_TEMP}/AppDir"
          stage_dir="${RUNNER_TEMP}/linux-stage/Huffman-Linux-x86_64"
          rm -rf "$work_dir" "$appdir" "$stage_dir"
          mkdir -p "$work_dir" "$stage_dir"

          export PATH="${RUNNER_TEMP}/tools:${PATH}"
          export QMAKE="/usr/bin/qmake6"
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so;libqwayland-egl.so;libqwayland-generic.so"
          export APPIMAGE_EXTRACT_AND_RUN=1

          (
            cd "$work_dir"
            "${RUNNER_TEMP}/tools/linuxdeploy-x86_64.AppImage" \
              --appdir "$appdir" \
              --executable "${GITHUB_WORKSPACE}/build/HuffmanGUI" \
              --desktop-file "${GITHUB_WORKSPACE}/packaging/linux/huffman-studio.desktop" \
              --icon-file "${GITHUB_WORKSPACE}/packaging/linux/huffman-studio.svg" \
              --exclude-library libwayland-client.so.0 \
              --plugin qt

            qt_plugins_dir="$(/usr/bin/qmake6 -query QT_INSTALL_PLUGINS)"
            if [ ! -d "$qt_plugins_dir" ]; then
              echo "::error::QT_INSTALL_PLUGINS directory not found: ${qt_plugins_dir}"
              exit 1
            fi

            for plugin_dir in \
              wayland-shell-integration \
              wayland-graphics-integration-client \
              wayland-decoration-client
            do
              src_dir="${qt_plugins_dir}/${plugin_dir}"
              if [ ! -d "$src_dir" ]; then
                echo "::error::Missing Qt Wayland helper plugin directory: ${src_dir}"
                exit 1
              fi
              mkdir -p "${appdir}/usr/plugins/${plugin_dir}"
              cp -a "${src_dir}/." "${appdir}/usr/plugins/${plugin_dir}/"
            done

            find "$appdir" \( -type f -o -type l \) -name "libwayland-client.so.0" -delete

            "${RUNNER_TEMP}/tools/linuxdeploy-x86_64.AppImage" \
              --appdir "$appdir" \
              --deploy-deps-only "${appdir}/usr/plugins/wayland-shell-integration" \
              --deploy-deps-only "${appdir}/usr/plugins/wayland-graphics-integration-client" \
              --deploy-deps-only "${appdir}/usr/plugins/wayland-decoration-client" \
              --exclude-library libwayland-client.so.0 \
              --output appimage
          )

          shopt -s nullglob
          appimages=("${work_dir}"/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 generated AppImage in ${work_dir}, found ${#appimages[@]}."
            ls -la "$work_dir"
            exit 1
          fi

          mv "${appimages[0]}" "${stage_dir}/HuffmanStudio-x86_64.AppImage"
          chmod 0755 "${stage_dir}/HuffmanStudio-x86_64.AppImage"

          cp "${GITHUB_WORKSPACE}/build/HuffmanCLI" "${stage_dir}/HuffmanCLI"
          chmod 0755 "${stage_dir}/HuffmanCLI"

          cp "${GITHUB_WORKSPACE}/packaging/linux/README-Linux.txt" "${stage_dir}/README-Linux.txt"

      - name: Verify AppImage contents, ldd dependencies, CLI, and smoke test
        run: |
          stage_root="${RUNNER_TEMP}/linux-stage"
          stage_dir="${stage_root}/Huffman-Linux-x86_64"
          appimage="${stage_dir}/HuffmanStudio-x86_64.AppImage"
          cli_bin="${stage_dir}/HuffmanCLI"
          out_dir="${RUNNER_TEMP}/linux-artifacts"
          inspect_dir="${RUNNER_TEMP}/appimage-inspect"

          rm -rf "$out_dir" "$inspect_dir"
          mkdir -p "$out_dir" "$inspect_dir"

          test -x "$appimage"
          test -x "$cli_bin"
          file "$appimage" | grep -q "x86-64"
          file "$cli_bin" | grep -q "x86-64"

          (
            cd "$inspect_dir"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null
          )

          root="${inspect_dir}/squashfs-root"
          test -x "${root}/usr/bin/HuffmanGUI"
          test -f "${root}/usr/lib/libQt6Core.so.6"
          test -f "${root}/usr/lib/libQt6Gui.so.6"
          test -f "${root}/usr/lib/libQt6Widgets.so.6"
          test -f "${root}/usr/plugins/platforms/libqxcb.so"
          test -f "${root}/usr/plugins/platforms/libqoffscreen.so"
          test -f "${root}/usr/plugins/platforms/libqwayland-egl.so"
          test -f "${root}/usr/plugins/platforms/libqwayland-generic.so"
          test -d "${root}/usr/plugins/wayland-shell-integration"
          test -f "${root}/usr/plugins/wayland-shell-integration/libxdg-shell.so"
          test -d "${root}/usr/plugins/wayland-graphics-integration-client"
          test -f "${root}/usr/plugins/wayland-graphics-integration-client/libqt-plugin-wayland-egl.so"
          test -d "${root}/usr/plugins/wayland-decoration-client"

          if [ -e "${root}/usr/lib/libc.so.6" ] || [ -e "${root}/usr/lib/libwayland-client.so.0" ]; then
            echo "::error::Fundamental system libraries (libc.so.6 / libwayland-client.so.0) must not be bundled inside the AppImage."
            exit 1
          fi

          echo "Bundled libraries under AppDir/usr/lib:"
          ls -lh "${root}/usr/lib"
          echo "Bundled plugins under AppDir/usr/plugins:"
          find "${root}/usr/plugins" -type f | sort

          check_ldd() {
            local target="$1"
            local out
            out="$(LD_LIBRARY_PATH="${root}/usr/lib" ldd "$target")"
            if grep -q "not found" <<< "$out"; then
              echo "::error::Unresolved shared library dependency in $target"
              echo "$out"
              exit 1
            fi
          }

          check_ldd "${root}/usr/bin/HuffmanGUI"
          for lib in "${root}/usr/lib/"*.so*; do
            [ -f "$lib" ] && check_ldd "$lib"
          done
          for plugin in \
            "${root}/usr/plugins/platforms/"*.so \
            "${root}/usr/plugins/wayland-shell-integration/"*.so \
            "${root}/usr/plugins/wayland-graphics-integration-client/"*.so \
            "${root}/usr/plugins/wayland-decoration-client/"*.so
          do
            [ -f "$plugin" ] && check_ldd "$plugin"
          done

          echo "CLI shared library dependencies:"
          cli_ldd="$(ldd "$cli_bin")"
          echo "$cli_ldd"
          if grep -q "not found" <<< "$cli_ldd"; then
            echo "::error::Unresolved shared library dependency in HuffmanCLI."
            exit 1
          fi
          printf "3\n" | "$cli_bin" >/dev/null

          set +e
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 3s "$appimage" >"${RUNNER_TEMP}/appimage-smoke.log" 2>&1
          smoke_rc=$?
          set -e
          if [ "$smoke_rc" -ne 124 ]; then
            echo "::error::AppImage offscreen startup smoke test failed with exit code ${smoke_rc}."
            cat "${RUNNER_TEMP}/appimage-smoke.log"
            exit 1
          fi
          echo "AppImage offscreen startup smoke test passed (remained running for 3s until SIGTERM timeout)."

          tar -C "$stage_root" -czf "${out_dir}/Huffman-Linux-x86_64.tar.gz" Huffman-Linux-x86_64
          (
            cd "$out_dir"
            sha256sum Huffman-Linux-x86_64.tar.gz > Huffman-Linux-x86_64.tar.gz.sha256
          )
          ls -lh "$out_dir"
          cat "${out_dir}/Huffman-Linux-x86_64.tar.gz.sha256"

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Huffman-Linux-x86_64
          path: |
            ${{ runner.temp }}/linux-artifacts/Huffman-Linux-x86_64.tar.gz
            ${{ runner.temp }}/linux-artifacts/Huffman-Linux-x86_64.tar.gz.sha256
          retention-days: 30
